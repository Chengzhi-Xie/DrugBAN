name: MS-LPCC cluster benchmark

on:
  push:
    branches:
      - agent/mslpcc-cluster-benchmark
    paths:
      - mslpcc/**
      - .github/workflows/mslpcc_cluster_benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: formula_only_scjke/requirements.txt
      - name: Install dependencies
        run: pip install -r formula_only_scjke/requirements.txt
      - name: Validate formula-only implementation
        run: |
          # The benchmark must remain free of fitted predictive models.
          ! grep -E "LogisticRegression|RandomForest|XGBoost|CatBoost|torch|tensorflow|\.fit\(" mslpcc/benchmark_mslpcc.py
          python -m py_compile mslpcc/benchmark_mslpcc.py
      - name: Run MS-LPCC benchmark
        run: python mslpcc/benchmark_mslpcc.py
      - uses: actions/upload-artifact@v4
        with:
          name: mslpcc-cluster-results
          path: mslpcc/results/mslpcc_cluster_results.json
